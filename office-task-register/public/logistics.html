<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logistics | Demand Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2b27;--paper:#fbf9f3;--ledger:#f1ece0;--line:#d9cfb8;--teal:#0f3d3e;--green:#3f6b4c;--red:#a6402b}*{box-sizing:border-box}body{margin:0;padding:32px 16px 70px;background:radial-gradient(circle at 15% 5%,#b08d3e18,transparent 38%),var(--ledger);font-family:'IBM Plex Sans',sans-serif;color:var(--ink)}main{max-width:1050px;margin:auto}.book{background:var(--teal);color:#f1ece0;padding:26px 30px 22px;border-bottom:4px solid #b08d3e;border-radius:6px 6px 2px 2px;box-shadow:0 8px 20px #1c2b2720}.book h1{font:700 27px 'IBM Plex Serif',serif;margin:0 0 5px}.book p{margin:0;color:#cfe3dd;font:12px 'IBM Plex Mono',monospace}.button,.action{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:4px;padding:8px 12px;font-weight:600;cursor:pointer}.book .button{float:right;margin-top:-32px;background:#ffffff18;border-color:#ffffff55}.card{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 6px 16px #1c2b2718}.card h2{font:600 17px 'IBM Plex Serif',serif;margin:0;padding:14px 20px;border-bottom:1px solid var(--line)}.filters{display:flex;gap:12px;align-items:center;padding:14px 20px;background:var(--ledger);border-bottom:1px solid var(--line)}select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:9px 10px;color:var(--ink)}.scroll{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line)}.table th{background:var(--ledger);color:#68766d;font:600 11px 'IBM Plex Mono',monospace;text-transform:uppercase}.table tr:last-child td{border-bottom:0}.items{display:grid;gap:7px}.item{display:flex;align-items:center;gap:8px}.item label{min-width:250px}.item input{accent-color:var(--teal)}.status{font:600 11px 'IBM Plex Mono',monospace;text-transform:uppercase;color:var(--green);white-space:nowrap}.pending{color:#8a7550}.action{font-size:12px}.action:disabled{opacity:.45;cursor:not-allowed}.empty,.error{padding:22px 20px;color:#78827d}.error{color:var(--red)}.summary td:last-child{font-weight:600;color:var(--teal)}@media(max-width:620px){body{padding:16px 10px 50px}.book{padding:22px 18px}.book h1{font-size:22px}.book .button{float:none;margin:14px 0 0}.filters{align-items:stretch;flex-direction:column}.item label{min-width:220px}}
</style>
</head>
<body><main>
<header class="book"><button class="button" id="back">Back to tasks</button><h1>Logistics Demand Overview</h1><p>Select what is being brought, then mark those items as on the way.</p></header>
<section class="card"><h2>Overall demand</h2><div class="filters"><label for="warehouse">Warehouse:</label><select id="warehouse"><option value="all">All warehouses</option><option>FC Faizabad WH</option><option>FC I10 WH</option></select></div><div class="scroll"><table class="table"><thead><tr><th>Demand</th><th>Items</th><th>Status</th><th>Action</th></tr></thead><tbody id="demands"><tr><td colspan="4" class="empty">Loading demands...</td></tr></tbody></table></div></section>
<section class="card"><h2>Required quantities</h2><div class="scroll"><table class="table summary"><thead><tr><th>Product</th><th>Warehouse</th><th>Total quantity</th></tr></thead><tbody id="summary"><tr><td colspan="3" class="empty">Loading summary...</td></tr></tbody></table></div></section>
</main><script>
const api=async(path,opts={})=>{const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})},credentials:'include'});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};
const esc=v=>{const e=document.createElement('div');e.textContent=v??'';return e.innerHTML};let all=[];
function itemsOf(d){return Array.isArray(d.items)?d.items:[]}
function render(){const warehouse=document.getElementById('warehouse').value;const body=document.getElementById('demands');const summary=new Map();body.innerHTML='';let shown=0;all.forEach(d=>{const items=itemsOf(d).map((item,index)=>({...item,index})).filter(item=>warehouse==='all'||item.warehouse===warehouse);if(!items.length)return;shown++;items.forEach(item=>{const key=item.name+'::'+item.warehouse;if(!summary.has(key))summary.set(key,{name:item.name,warehouse:item.warehouse,quantity:0});summary.get(key).quantity+=item.quantity});const row=document.createElement('tr');row.innerHTML=`<td><b>${esc(d.employee_name)}</b><br><small>${esc(d.date)}</small></td><td><div class="items">${items.map(item=>`<label class="item"><input type="checkbox" data-index="${item.index}" ${item.status==='on_the_way'?'checked disabled':''}><span>${esc(item.name)} (${item.quantity}) - ${esc(item.warehouse||'-')}</span></label>`).join('')}</div></td><td class="status">${items.map(item=>`<span class="${item.status==='on_the_way'?'':'pending'}">${esc(item.status||d.status)}</span>`).join('<br>')}</td><td><button class="action" ${items.every(item=>item.status==='on_the_way')?'disabled':''}>On the way</button></td>`;row.querySelector('.action').onclick=async()=>{const selected=[...row.querySelectorAll('input:not(:disabled):checked')].map(input=>Number(input.dataset.index));if(!selected.length)return;try{await api('/api/logistics/demands/'+d.id,{method:'PATCH',body:JSON.stringify({itemIndexes:selected,status:'on_the_way'})});await load()}catch(e){alert(e.message)}};body.appendChild(row)});if(!shown)body.innerHTML='<tr><td colspan="4" class="empty">No demands for this warehouse.</td></tr>';const summaryBody=document.getElementById('summary');summaryBody.innerHTML='';[...summary.values()].sort((a,b)=>a.name.localeCompare(b.name)).forEach(item=>{summaryBody.innerHTML+=`<tr><td>${esc(item.name)}</td><td>${esc(item.warehouse||'-')}</td><td>${item.quantity}</td></tr>`});if(!summary.size)summaryBody.innerHTML='<tr><td colspan="3" class="empty">No demand to summarize.</td></tr>'}
async function load(){try{all=await api('/api/logistics/demands');render()}catch(e){document.getElementById('demands').innerHTML=`<tr><td colspan="4" class="error">${esc(e.message)}</td></tr>`}}document.getElementById('warehouse').onchange=render;document.getElementById('back').onclick=()=>location.href='/';api('/api/me').then(me=>{if(!['admin','logistics'].includes(me.role))location.href='/'}).catch(()=>location.href='/');load();
</script></body></html>
