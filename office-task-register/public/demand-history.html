<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demand History</title>
<style>
:root{--ink:#1c2b27;--paper:#fbf9f3;--ledger:#f1ece0;--line:#d9cfb8;--teal:#0f3d3e;--green:#3f6b4c;--danger:#b42318;--danger-hover:#912018}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px 70px;background:radial-gradient(circle at 15% 5%,#b08d3e18,transparent 38%),var(--ledger);font-family:'IBM Plex Sans',Arial,sans-serif;color:var(--ink)}
main{max-width:1150px;margin:auto}
.book{background:var(--teal);color:#f1ece0;padding:26px 30px 22px;border-bottom:4px solid #b08d3e;border-radius:6px 6px 2px 2px;position:relative}
.book h1{font:700 27px Georgia,serif;margin:0 0 5px}
.book p{margin:0;color:#cfe3dd}
.header-actions{position:absolute;top:24px;right:30px;display:flex;gap:10px;align-items:center}
.button{border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:4px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s ease}
.button:hover{background:#ffffff30}
.button.danger{background:#b42318;border-color:#b42318;color:#fff}
.button.danger:hover{background:#912018}
.card{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,0.06)}
.scroll{overflow-x:auto}
.table{width:100%;border-collapse:collapse;min-width:850px}
.table th,.table td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.table th{background:var(--ledger);color:#68766d;font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.table tr:last-child td{border-bottom:0}
.table tr:hover td{background:#fdfcf9}
.status{color:var(--green);font-weight:700;display:inline-block;padding:3px 8px;background:#e8f5e9;border-radius:12px;font-size:12px}
.btn-delete{background:#b42318;color:#fff;border:none;border-radius:4px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background 0.2s}
.btn-delete:hover{background:#912018}
.empty,.error{padding:30px 20px;text-align:center;color:#78827d;font-size:14px}
.error{color:#a6402b}
@media(max-width:768px){
  body{padding:16px 10px}
  .book{padding:22px 18px}
  .book h1{font-size:22px}
  .header-actions{position:static;margin-top:16px;flex-wrap:wrap}
}
</style>
</head>
<body>
<main>
  <header class="book">
    <div class="header-actions">
      <button type="button" class="button danger" id="clearAllBtn" onclick="clearAllHistory()">🗑️ Clear All History</button>
      <button type="button" class="button" id="back">← Back to admin</button>
    </div>
    <h1>Completed Demand History</h1>
    <p>Archived demands completed by admin.</p>
  </header>
  <section class="card">
    <div class="scroll">
      <table class="table">
        <thead>
          <tr>
            <th>Employee</th>
            <th>Date</th>
            <th>Products</th>
            <th>Warehouse</th>
            <th>Invoice Number</th>
            <th>Demanded</th>
            <th>Picked</th>
            <th>Status</th>
            <th>Completed at</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="list">
          <tr><td colspan="10" class="empty">Loading history...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script>
const api = async (path, opts = {}) => {
  const r = await fetch(path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts
  });
  let d = null;
  try { d = await r.json(); } catch(e) {}
  if (!r.ok) throw Error((d && d.error) || 'Request failed with status ' + r.status);
  return d;
};

const esc = v => {
  const e = document.createElement('div');
  e.textContent = v ?? '';
  return e.innerHTML;
};

const items = d => Array.isArray(d.items) ? d.items : [];

async function load() {
  const list = document.getElementById('list');
  try {
    const me = await api('/api/me');
    if (me.role !== 'admin') throw Error('Admin access required');
    const rows = await api('/api/admin/demands/history');
    list.innerHTML = '';
    if (!rows.length) {
      list.innerHTML = '<tr><td colspan="10" class="empty">No completed demands yet.</td></tr>';
      return;
    }
    rows.forEach(d => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><b>${esc(d.employee_name)}</b>${d.creator_role === 'admin' ? ' <span style="background:#172554;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;">ADMIN</span>' : ''}</td>
        <td>${esc(d.date)}</td>
        <td>${items(d).map(item => `${esc(item.name)} (${item.quantity})`).join('<br>')}</td>
        <td>${items(d).map(item => esc(item.warehouse || '-')).join('<br>')}</td>
        <td>${items(d).map(item => esc(item.invoiceNumber || '-')).join('<br>')}</td>
        <td>${d.quantity}</td>
        <td>${items(d).map(item => item.pickedQuantity == null ? '-' : item.pickedQuantity).join('<br>')}</td>
        <td><span class="status">Completed</span></td>
        <td>${new Date(d.completedAt || d.updated_at).toLocaleString('en-GB')}</td>
        <td><button type="button" class="btn-delete" onclick="deleteHistoryItem('${d.id}')">🗑️ Delete</button></td>
      `;
      list.appendChild(row);
    });
  } catch (e) {
    list.innerHTML = `<tr><td colspan="10" class="error">${esc(e.message)}</td></tr>`;
  }
}

async function deleteHistoryItem(id) {
  if (!confirm('Are you sure you want to delete this demand history record?')) return;
  try {
    await api('/api/admin/demands/history/' + id, { method: 'DELETE' });
    load();
  } catch (err) {
    alert('❌ ' + err.message);
  }
}

async function clearAllHistory() {
  if (!confirm('Are you sure you want to clear ALL demand history records? This cannot be undone.')) return;
  try {
    await api('/api/admin/demands/history', { method: 'DELETE' });
    load();
  } catch (err) {
    alert('❌ ' + err.message);
  }
}

document.getElementById('back').onclick = () => location.href = '/demands-admin.html';
load();
</script>
</body>
</html>
