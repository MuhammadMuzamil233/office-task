<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demand History</title>
<style>
:root{--ink:#1c2b27;--paper:#fbf9f3;--ledger:#f1ece0;--line:#d9cfb8;--teal:#0f3d3e;--green:#3f6b4c;--danger:#b42318;--danger-hover:#912018}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px 70px;background:radial-gradient(circle at 15% 5%,#b08d3e18,transparent 38%),var(--ledger);font-family:'IBM Plex Sans',Arial,sans-serif;color:var(--ink)}
main{max-width:1150px;margin:auto}
.book{background:var(--teal);color:#f1ece0;padding:26px 30px 22px;border-bottom:4px solid #b08d3e;border-radius:6px 6px 2px 2px;position:relative}
.book h1{font:700 27px Georgia,serif;margin:0 0 5px}
.book p{margin:0;color:#cfe3dd}
.header-actions{position:absolute;top:24px;right:30px;display:flex;gap:10px;align-items:center}
.button{border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:4px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s ease}
.button:hover{background:#ffffff30}
.button.danger{background:#b42318;border-color:#b42318;color:#fff}
.button.danger:hover{background:#912018}
.card{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,0.06)}
.filters{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--ledger);border-bottom:1px solid var(--line);flex-wrap:wrap}
.filter-item{display:flex;align-items:center;gap:6px}
.filter-item label{font-size:11px;font-weight:600;text-transform:uppercase;color:#68766d;letter-spacing:0.5px}
.filter-item select,.filter-item input{padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font-size:13px}
.scroll{overflow-x:auto}
.table{width:100%;border-collapse:collapse;min-width:850px}
.table th,.table td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.table th{background:var(--ledger);color:#68766d;font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.table tr:last-child td{border-bottom:0}
.table tr:hover td{background:#fdfcf9}
.status{color:var(--green);font-weight:700;display:inline-block;padding:3px 8px;background:#e8f5e9;border-radius:12px;font-size:12px}
.btn-delete{background:#b42318;color:#fff;border:none;border-radius:4px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background 0.2s}
.btn-delete:hover{background:#912018}
.empty,.error{padding:30px 20px;text-align:center;color:#78827d;font-size:14px}
.error{color:#a6402b}
@media(max-width:768px){
  body{padding:12px 10px 60px}
  .book{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
  .book h1{font-size:20px}
  .header-actions{position:static;margin-top:4px;display:flex;gap:8px;width:100%}
  .header-actions .button{flex:1;justify-content:center;padding:8px 10px;font-size:12px}
  .filters{flex-direction:column;align-items:stretch;gap:8px;padding:12px 14px}
  .filter-item{width:100%;flex-direction:column;align-items:flex-start}
  .filter-item select,.filter-item input{width:100%;box-sizing:border-box;height:38px}
  .scroll-hint{display:block;padding:8px 14px;background:#fefce8;color:#854d0e;font-size:11px;font-weight:600;text-align:center;border-bottom:1px solid #fef08a}
  th,td{padding:9px 10px;font-size:12px}
}
.scroll-hint{display:none}
</style>
</head>
<body>
<main>
  <header class="book">
    <div class="header-actions">
      <button type="button" class="button danger" id="clearAllBtn" onclick="clearAllHistory()">🗑️ Clear All History</button>
      <button type="button" class="button" id="back">← Back</button>
    </div>
    <h1>Completed Demand History</h1>
    <p id="subHeader">Archived completed demands overview.</p>
  </header>
  <section class="card">
    <div class="filters">
      <div class="filter-item">
        <label for="warehouseFilter">Warehouse:</label>
        <select id="warehouseFilter">
          <option value="all">All warehouses</option>
          <option value="FC Faizabad WH">FC Faizabad WH</option>
          <option value="FC I10 WH">FC I10 WH</option>
        </select>
      </div>
      <div class="filter-item" style="flex:1;min-width:200px;">
        <input type="search" id="searchInput" placeholder="Search by employee, product, invoice..." style="width:100%;">
      </div>
    </div>
    <div class="scroll-hint">👈 Swipe table left / right to view items &amp; delete 👉</div>
    <div class="scroll">
      <table class="table">
        <thead>
          <tr>
            <th>Employee</th>
            <th>Date</th>
            <th>Products</th>
            <th>Warehouse</th>
            <th>Invoice Number</th>
            <th>Demanded</th>
            <th>Picked</th>
            <th>Status</th>
            <th>Completed at</th>
            <th id="actionHeader">Action</th>
          </tr>
        </thead>
        <tbody id="list">
          <tr><td colspan="10" class="empty">Loading history...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script>
const api = async (path, opts = {}) => {
  const r = await fetch(path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts
  });
  let d = null;
  try { d = await r.json(); } catch(e) {}
  if (!r.ok) throw Error((d && d.error) || 'Request failed with status ' + r.status);
  return d;
};

const esc = v => {
  const e = document.createElement('div');
  e.textContent = v ?? '';
  return e.innerHTML;
};

const items = d => Array.isArray(d.items) ? d.items : [];

let allRows = [];
let currentUser = null;

function render() {
  const list = document.getElementById('list');
  const isAdmin = currentUser && currentUser.role === 'admin';
  const colSpan = isAdmin ? 10 : 9;

  const warehouse = document.getElementById('warehouseFilter').value;
  const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  const filtered = allRows.filter(d => {
    const demandItems = items(d);
    if (warehouse !== 'all' && !demandItems.some(i => (i.warehouse || '') === warehouse)) {
      return false;
    }
    if (query) {
      const matchEmp = (d.employee_name || '').toLowerCase().includes(query);
      const matchDate = (d.date || '').toLowerCase().includes(query);
      const matchItem = demandItems.some(i =>
        (i.name || '').toLowerCase().includes(query) ||
        (i.invoiceNumber || '').toLowerCase().includes(query) ||
        (i.warehouse || '').toLowerCase().includes(query)
      );
      if (!matchEmp && !matchDate && !matchItem) return false;
    }
    return true;
  });

  list.innerHTML = '';
  if (!filtered.length) {
    list.innerHTML = `<tr><td colspan="${colSpan}" class="empty">No demand history found.</td></tr>`;
    return;
  }

  filtered.forEach(d => {
    const demandItems = items(d);
    if (!demandItems.length) {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><b>${esc(d.employee_name)}</b>${d.creator_role === 'admin' ? ' <span style="background:#172554;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;">ADMIN</span>' : ''}</td>
        <td>${esc(d.date)}</td>
        <td>${esc(d.products || '-')}</td>
        <td>-</td>
        <td>-</td>
        <td>${d.quantity || 0}</td>
        <td>-</td>
        <td><span class="status">Completed</span></td>
        <td>${new Date(d.completedAt || d.updated_at).toLocaleString('en-GB')}</td>
        ${isAdmin ? `<td><button type="button" class="btn-delete" onclick="deleteFullHistoryRecord('${d.id}')">🗑️ Delete</button></td>` : ''}
      `;
      list.appendChild(row);
      return;
    }

    demandItems.forEach((item, itemIdx) => {
      const row = document.createElement('tr');
      if (itemIdx === 0) row.style.borderTop = '2px solid #cfc2a8';
      row.innerHTML = `
        <td>${itemIdx === 0 ? `<b>${esc(d.employee_name)}</b>${d.creator_role === 'admin' ? ' <span style="background:#172554;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;">ADMIN</span>' : ''}` : ''}</td>
        <td>${itemIdx === 0 ? esc(d.date) : ''}</td>
        <td><b>${esc(item.name)}</b>${item.isUrgent ? ' <span style="background:#c0392b;color:#fff;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;">⚡ URGENT</span>' : ''}</td>
        <td>${esc(item.warehouse || '-')}</td>
        <td><code>${esc(item.invoiceNumber || '-')}</code></td>
        <td>${item.quantity}</td>
        <td><b>${item.pickedQuantity == null ? '-' : item.pickedQuantity}</b></td>
        <td><span class="status">Completed</span></td>
        <td>${itemIdx === 0 ? new Date(d.completedAt || d.updated_at).toLocaleString('en-GB') : ''}</td>
        ${isAdmin ? `
          <td>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">
              <button type="button" class="btn-delete" title="Delete only this item from history" onclick="deleteSingleHistoryItem('${d.id}', ${itemIdx}, '${esc(item.name).replace(/'/g, "\\'")}')">🗑️ Delete Item</button>
              ${demandItems.length > 1 && itemIdx === 0 ? `<button type="button" class="btn-delete" style="background:#4b5563;" title="Delete all items of this demand" onclick="deleteFullHistoryRecord('${d.id}')">🗑️ All</button>` : ''}
            </div>
          </td>
        ` : ''}
      `;
      list.appendChild(row);
    });
  });
}

async function load() {
  const list = document.getElementById('list');
  try {
    currentUser = await api('/api/me');
    if (!['admin', 'logistics', 'supporting_staff'].includes(currentUser.role)) {
      throw Error('Admin, logistics or supporting staff access required');
    }

    const isAdmin = currentUser.role === 'admin';
    const clearBtn = document.getElementById('clearAllBtn');
    if (clearBtn) clearBtn.style.display = isAdmin ? 'inline-flex' : 'none';

    const actionHeader = document.getElementById('actionHeader');
    if (actionHeader) actionHeader.style.display = isAdmin ? '' : 'none';

    const backBtn = document.getElementById('back');
    if (isAdmin) {
      backBtn.textContent = '← Back to admin';
      backBtn.onclick = () => location.href = '/demands-admin.html';
    } else if (currentUser.role === 'supporting_staff') {
      backBtn.textContent = '← Back to inspection';
      backBtn.onclick = () => location.href = '/supporting-staff.html';
    } else {
      backBtn.textContent = '← Back to logistics';
      backBtn.onclick = () => location.href = '/logistics.html';
    }

    allRows = await api('/api/admin/demands/history');
    render();
  } catch (e) {
    const colSpan = (currentUser && currentUser.role === 'admin') ? 10 : 9;
    list.innerHTML = `<tr><td colspan="${colSpan}" class="error">${esc(e.message)}</td></tr>`;
  }
}

async function deleteSingleHistoryItem(id, itemIndex, itemName) {
  if (!confirm(`Are you sure you want to delete "${itemName || 'this item'}" from demand history?`)) return;
  try {
    await api(`/api/admin/demands/history/${id}/item/${itemIndex}`, { method: 'DELETE' });
    load();
  } catch (err) {
    alert('❌ ' + err.message);
  }
}

async function deleteFullHistoryRecord(id) {
  if (!confirm('Are you sure you want to delete this full demand history record?')) return;
  try {
    await api('/api/admin/demands/history/' + id, { method: 'DELETE' });
    load();
  } catch (err) {
    alert('❌ ' + err.message);
  }
}

async function clearAllHistory() {
  if (!confirm('Are you sure you want to clear ALL demand history records? This cannot be undone.')) return;
  try {
    await api('/api/admin/demands/history', { method: 'DELETE' });
    load();
  } catch (err) {
    alert('❌ ' + err.message);
  }
}

document.getElementById('warehouseFilter').onchange = render;
document.getElementById('searchInput').oninput = render;
load();
</script>
</body>
</html>
