<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demand History</title>
<style>
:root{--ink:#1c2b27;--paper:#fbf9f3;--ledger:#f1ece0;--line:#d9cfb8;--teal:#0f3d3e;--green:#3f6b4c}*{box-sizing:border-box}body{margin:0;padding:32px 16px 70px;background:radial-gradient(circle at 15% 5%,#b08d3e18,transparent 38%),var(--ledger);font-family:'IBM Plex Sans',Arial,sans-serif;color:var(--ink)}main{max-width:1050px;margin:auto}.book{background:var(--teal);color:#f1ece0;padding:26px 30px 22px;border-bottom:4px solid #b08d3e;border-radius:6px 6px 2px 2px}.book h1{font:700 27px Georgia,serif;margin:0 0 5px}.book p{margin:0;color:#cfe3dd}.button{float:right;margin-top:-34px;border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:4px;padding:8px 12px;font-weight:600;cursor:pointer}.card{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}.scroll{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}.table th{background:var(--ledger);color:#68766d;font-size:11px;text-transform:uppercase}.table tr:last-child td{border-bottom:0}.status{color:var(--green);font-weight:600}.empty,.error{padding:22px 20px;color:#78827d}.error{color:#a6402b}@media(max-width:620px){body{padding:16px 10px}.book{padding:22px 18px}.book h1{font-size:22px}.button{float:none;margin:14px 0 0}}
</style>
</head>
<body><main><header class="book"><button class="button" id="back">Back to admin</button><h1>Completed Demand History</h1><p>Archived demands completed by admin.</p></header><section class="card"><div class="scroll"><table class="table"><thead><tr><th>Employee</th><th>Date</th><th>Products</th><th>Warehouse</th><th>Quantity</th><th>Status</th><th>Completed at</th></tr></thead><tbody id="list"><tr><td colspan="7" class="empty">Loading history...</td></tr></tbody></table></div></section></main><script>
const api=async path=>{const r=await fetch(path,{credentials:'include'});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};const esc=v=>{const e=document.createElement('div');e.textContent=v??'';return e.innerHTML};const items=d=>Array.isArray(d.items)?d.items:[];async function load(){try{const me=await api('/api/me');if(me.role!=='admin')throw Error('Admin access required');const rows=await api('/api/admin/demands/history');const list=document.getElementById('list');list.innerHTML='';if(!rows.length){list.innerHTML='<tr><td colspan="7" class="empty">No completed demands yet.</td></tr>';return}rows.forEach(d=>{const row=document.createElement('tr');row.innerHTML=`<td>${esc(d.employee_name)}</td><td>${esc(d.date)}</td><td>${items(d).map(item=>`${esc(item.name)} (${item.quantity})`).join('<br>')}</td><td>${items(d).map(item=>esc(item.warehouse||'-')).join('<br>')}</td><td>${d.quantity}</td><td class="status">Completed</td><td>${new Date(d.completedAt||d.updated_at).toLocaleString('en-GB')}</td>`;list.appendChild(row)})}catch(e){document.getElementById('list').innerHTML=`<tr><td colspan="7" class="error">${esc(e.message)}</td></tr>`}}document.getElementById('back').onclick=()=>location.href='/demands-admin.html';load();
</script></body></html>
