<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demand Management</title><style>:root{--ink:#1c2b27;--paper:#fbf9f3;--ledger:#f1ece0;--line:#d9cfb8;--teal:#0f3d3e;--red:#a6402b;--green:#3f6b4c}*{box-sizing:border-box}body{margin:0;padding:32px 16px 80px;background:var(--ledger);font:14px Segoe UI,sans-serif;color:var(--ink)}main{max-width:1200px;margin:auto}.book{background:var(--teal);color:#fff;padding:22px 28px;border-bottom:4px solid #b08d3e;display:flex;justify-content:space-between}.book h1{margin:0;font:700 25px Georgia}.button,.action{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:4px;padding:8px 11px;cursor:pointer}.button{background:transparent;border-color:#fff}.card{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}.card h2{margin:0;padding:14px 20px;border-bottom:1px solid var(--line);font:600 17px Georgia}.scroll{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1100px}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{background:var(--ledger);font-size:11px;text-transform:uppercase;color:#68766d}.table input,.table textarea,.table select{width:100%;padding:7px;border:1px solid var(--line);border-radius:3px;background:#fff}.table textarea{min-height:42px;resize:vertical}.item-row td{border-bottom:1px dashed var(--line)}.demand-head td{border-top:2px solid var(--teal);font-weight:600}.actions{display:flex;flex-wrap:wrap;gap:5px;min-width:220px}.reject,.cancel{border-color:var(--red);background:transparent;color:var(--red)}.complete{border-color:var(--green);background:var(--green)}.empty,.error{padding:20px;color:#78827d}.error{color:var(--red)}</style></head><body><main><header class="book"><h1>Demand Management</h1><button class="button" id="back">Back to tasks</button></header><section class="card"><h2>Employee Demands</h2><div class="scroll"><table class="table"><thead><tr><th>Employee Name</th><th>Date</th><th>Product</th><th>Item Quantity</th><th>Total Quantity</th><th>Status</th><th>Submitted At</th><th>Actions</th></tr></thead><tbody id="list"><tr><td colspan="8" class="empty">Loading demands...</td></tr></tbody></table></div></section></main><script>
const api=async(path,opts={})=>{const response=await fetch(path,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})},credentials:"include"});const data=await response.json();if(!response.ok)throw new Error(data.error||"Request failed");return data};
const esc=value=>{const element=document.createElement("div");element.textContent=value??"";return element.innerHTML};
const date=value=>value?new Date(value).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"-";
const itemList=d=>Array.isArray(d.items)?d.items:String(d.products||"").split(",").map(value=>{const match=value.trim().match(/^(.*?)(?:\s*\((\d+)\))?$/);return{name:match[1].trim(),quantity:Number(match[2]||d.quantity||1)}}).filter(item=>item.name);
async function load(){try{const me=await api("/api/me");if(me.role!=="admin")throw new Error("Admin access required");const demands=await api("/api/admin/demands"),list=document.getElementById("list");list.innerHTML="";demands.forEach(demand=>{const items=itemList(demand),total=items.reduce((sum,item)=>sum+item.quantity,0);items.forEach((item,index)=>{const row=document.createElement("tr");row.className=index===0?"demand-head item-row":"item-row";row.innerHTML=`<td>${index===0?`<b>${esc(demand.employee_name)}</b>`:""}</td><td>${index===0?esc(demand.date):""}</td><td>${esc(item.name)}</td><td>${item.quantity}</td><td>${index===0?total:""}</td><td>${index===0?esc(demand.status):""}</td><td>${index===0?date(demand.submitted_at):""}</td><td>${index===0?`<div class="actions"><button class="action approve">Approve</button><button class="action reject">Reject</button><button class="action complete">Completed</button><button class="action cancel">Cancel</button></div>`:""}</td>`;if(index===0){const update=async(status)=>{await api("/api/admin/demands/"+demand.id,{method:"PATCH",body:JSON.stringify({status})});load()};row.querySelector(".approve").onclick=()=>update("approved");row.querySelector(".reject").onclick=()=>update("rejected");row.querySelector(".complete").onclick=()=>update("completed");row.querySelector(".cancel").onclick=()=>update("cancelled")};list.appendChild(row)})});if(!demands.length)list.innerHTML='<tr><td colspan="8" class="empty">No demands submitted yet.</td></tr>'}catch(error){document.getElementById("list").innerHTML=`<tr><td colspan="8" class="error">${esc(error.message)}</td></tr>`}}document.getElementById("back").onclick=()=>location.href="/";load();
</script></body></html>
