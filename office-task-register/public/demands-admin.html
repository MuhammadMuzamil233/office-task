<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demand Management</title>
  <style>
    :root {
      --ink: #1c2b27;
      --paper: #fbf9f3;
      --ledger: #f1ece0;
      --line: #d9cfb8;
      --teal: #0f3d3e;
      --red: #a6402b;
      --green: #3f6b4c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px 80px;
      background: var(--ledger);
      font: 14px Segoe UI, sans-serif;
      color: var(--ink);
    }

    main {
      max-width: 1200px;
      margin: auto;
    }

    .book {
      background: var(--teal);
      color: #fff;
      padding: 22px 28px;
      border-bottom: 4px solid #b08d3e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .book h1 {
      margin: 0;
      font: 700 25px Georgia;
    }

    .button, .action {
      border: 1px solid var(--teal);
      background: var(--teal);
      color: #fff;
      border-radius: 4px;
      padding: 8px 11px;
      cursor: pointer;
    }

    .button {
      background: transparent;
      border-color: #fff;
    }

    .card {
      margin-top: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
    }

    .card h2 {
      margin: 0;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      font: 600 17px Georgia;
    }

    .filters-bar {
      padding: 16px 20px;
      background: var(--ledger);
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }

    .filters-bar label {
      font-weight: 600;
      color: var(--teal);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filters-bar select {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      font: 14px Segoe UI, sans-serif;
      min-width: 180px;
      cursor: pointer;
    }

    .scroll {
      overflow: auto;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }

    .table th, .table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .table th {
      background: var(--ledger);
      font-size: 11px;
      text-transform: uppercase;
      color: #68766d;
    }

    .table input, .table textarea, .table select {
      width: 100%;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fff;
    }

    .table textarea {
      min-height: 42px;
      resize: vertical;
    }

    .item-row td {
      border-bottom: 1px dashed var(--line);
    }

    .demand-head td {
      border-top: 2px solid var(--teal);
      font-weight: 600;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-width: 220px;
    }

    .reject, .cancel {
      border-color: var(--red);
      background: transparent;
      color: var(--red);
    }

    .complete {
      border-color: var(--green);
      background: var(--green);
    }

    .empty, .error {
      padding: 20px;
      color: #78827d;
    }

    .error {
      color: var(--red);
    }

    #summary-list-table {
      min-width: 600px;
    }
  </style>
</head>
<body>
  <main>
    <header class="book">
      <h1>Demand Management</h1>
          <span><button class="button" id="history">Demand history</button> <button class="button" id="back">Back to tasks</button></span>
    </header>

    <section class="card">
      <h2>Employee Demands</h2>
      
      <div class="filters-bar">
        <label>
          Filter by Warehouse:
          <select id="warehouse-filter">
            <option value="all">All Warehouses</option>
            <option value="FC Faizabad WH">FC Faizabad WH</option>
            <option value="FC I10 WH">FC I10 WH</option>
          </select>
        </label>
        <label>
          Status:
          <select id="status-filter">
            <option value="all">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
      </div>

      <div class="scroll">
        <table class="table">
          <thead>
            <tr>
              <th>Employee Name</th>
              <th>Date</th>
              <th>Product</th>
              <th>Warehouse</th>
              <th>Item Quantity</th>
              <th>Total Quantity</th>
              <th>Status</th>
              <th>Submitted At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="list">
            <tr>
              <td colspan="9" class="empty">Loading demands...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Total Demands Summary</h2>
      <div class="scroll">
        <table class="table" id="summary-list-table">
          <thead>
            <tr>
              <th>Product Name</th>
              <th>Warehouse</th>
              <th>Total Demanded Quantity</th>
            </tr>
          </thead>
          <tbody id="summary-list">
            <tr>
              <td colspan="3" class="empty">No products to summarize.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const api = async (path, opts = {}) => {
      const response = await fetch(path, {
        ...opts,
        headers: {
          "Content-Type": "application/json",
          ...(opts.headers || {})
        },
        credentials: "include"
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    };

    const esc = value => {
      const element = document.createElement("div");
      element.textContent = value ?? "";
      return element.innerHTML;
    };

    const date = value => value ? new Date(value).toLocaleString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }) : "-";

    const itemList = d => Array.isArray(d.items) ? d.items : String(d.products || "").split(",").map(value => {
      const match = value.trim().match(/^(.*?)(?:\s*\((\d+)\))?$/);
      return {
        name: match[1].trim(),
        quantity: Number(match[2] || d.quantity || 1),
        warehouse: ""
      };
    }).filter(item => item.name);

    let allDemands = [];

    async function load() {
      try {
        const me = await api("/api/me");
        if (me.role !== "admin") throw new Error("Admin access required");
        allDemands = await api("/api/admin/demands");
        render();
      } catch (error) {
        document.getElementById("list").innerHTML = `<tr><td colspan="9" class="error">${esc(error.message)}</td></tr>`;
      }
    }

    function render() {
      const warehouseFilter = document.getElementById("warehouse-filter").value;
      const statusFilter = document.getElementById("status-filter").value;
      const list = document.getElementById("list");
      list.innerHTML = "";

      const filteredDemands = [];
      const summaryMap = new Map();

      allDemands.forEach(demand => {
        // Status filter
        if (statusFilter !== "all" && demand.status !== statusFilter) {
          return;
        }

        const items = itemList(demand);
        // Warehouse filter on items
        const matchingItems = items.filter(item => {
          if (warehouseFilter === "all") return true;
          return item.warehouse === warehouseFilter;
        });

        if (matchingItems.length > 0) {
          filteredDemands.push({
            ...demand,
            items: matchingItems
          });

          // Aggregate quantities
          matchingItems.forEach(item => {
            const key = `${item.name}::${item.warehouse || "-"}`;
            if (!summaryMap.has(key)) {
              summaryMap.set(key, {
                name: item.name,
                warehouse: item.warehouse || "-",
                quantity: 0
              });
            }
            summaryMap.get(key).quantity += item.quantity;
          });
        }
      });

      // Render Detailed Demands
      filteredDemands.forEach(demand => {
        const total = demand.items.reduce((sum, item) => sum + item.quantity, 0);

        demand.items.forEach((item, index) => {
          const row = document.createElement("tr");
          row.className = index === 0 ? "demand-head item-row" : "item-row";
          
          row.innerHTML = `
            <td>${index === 0 ? `<b>${esc(demand.employee_name)}</b>` : ""}</td>
            <td>${index === 0 ? esc(demand.date) : ""}</td>
            <td>${esc(item.name)}</td>
            <td>${esc(item.warehouse || "-")}</td>
            <td>${item.quantity}</td>
            <td>${index === 0 ? total : ""}</td>
            <td>${index === 0 ? esc(demand.status) : ""}</td>
            <td>${index === 0 ? date(demand.submitted_at) : ""}</td>
            <td>
              ${index === 0 ? `
                <div class="actions">
                  <button class="action approve">Approve</button>
                  <button class="action reject">Reject</button>
                  <button class="action complete">Completed</button>
                  <button class="action cancel">Cancel</button>
                </div>
              ` : ""}
            </td>
          `;

          if (index === 0) {
            const update = async (status) => {
              await api("/api/admin/demands/" + demand.id, {
                method: "PATCH",
                body: JSON.stringify({ status })
              });
              load();
            };
            row.querySelector(".approve").onclick = () => update("approved");
            row.querySelector(".reject").onclick = () => update("rejected");
            row.querySelector(".complete").onclick = () => update("completed");
            row.querySelector(".cancel").onclick = () => update("cancelled");
          }

          list.appendChild(row);
        });
      });

      if (!filteredDemands.length) {
        list.innerHTML = '<tr><td colspan="9" class="empty">No demands matching the selected filters.</td></tr>';
      }

      // Render Aggregated Summary
      const summaryList = document.getElementById("summary-list");
      summaryList.innerHTML = "";

      const sortedSummary = Array.from(summaryMap.values()).sort((a, b) => a.name.localeCompare(b.name));

      sortedSummary.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><b>${esc(item.name)}</b></td>
          <td>${esc(item.warehouse)}</td>
          <td>${item.quantity}</td>
        `;
        summaryList.appendChild(row);
      });

      if (!sortedSummary.length) {
        summaryList.innerHTML = '<tr><td colspan="3" class="empty">No items to group and summarize.</td></tr>';
      }
    }

    // Set up filter change events
    document.getElementById("warehouse-filter").onchange = render;
    document.getElementById("status-filter").onchange = render;

    document.getElementById("back").onclick = () => location.href = "/";
    document.getElementById("history").onclick = () => location.href = "/demand-history.html";
    load();
  </script>
</body>
</html>
