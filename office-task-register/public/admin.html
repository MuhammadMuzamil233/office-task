<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Panel</title>
<style>
:root{--ink:#1C2B27;--paper:#FBF9F3;--ledger:#F1ECE0;--line:#D9CFB8;--teal:#0F3D3E;--brass:#B08D3E;--red:#A6402B}*{box-sizing:border-box}body{margin:0;padding:32px 16px 80px;background:radial-gradient(circle at 15% 10%,rgba(176,141,62,.07),transparent 40%),var(--ledger);font:14px 'Segoe UI',sans-serif;color:var(--ink)}.wrap{max-width:780px;margin:auto}.book{background:var(--teal);color:#F1ECE0;padding:22px 28px;border-bottom:4px solid var(--brass);border-radius:6px 6px 2px 2px;display:flex;align-items:center;justify-content:space-between;gap:16px}.book h1{margin:0;font:700 25px Georgia,serif}.button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;border-radius:4px;padding:8px 12px;cursor:pointer}.card{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 6px 16px rgba(28,43,39,.12)}.card h2{margin:0;padding:14px 20px;border-bottom:1px solid var(--line);font:600 17px Georgia,serif}.row{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}.row:last-child{border:0}textarea{flex:1;min-height:44px;border:1px solid var(--line);border-radius:4px;padding:9px;font:14px 'Segoe UI',sans-serif;resize:vertical}button.action{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:4px;padding:8px 11px;cursor:pointer}button.delete,button.reject{border-color:var(--red);background:transparent;color:var(--red)}.empty,.error{padding:20px;color:#78827d}.error{color:var(--red)}@media(max-width:480px){.book{padding:18px;align-items:flex-start;flex-direction:column}.card h2,.row{padding-left:16px;padding-right:16px}.row{flex-wrap:wrap}textarea{flex-basis:100%}}
</style></head>
<body><main class="wrap"><header class="book"><h1>Admin Panel</h1><button class="button" id="backBtn">Back to tasks</button></header><section class="card"><h2>Active Tasks</h2><div id="tasks"><div class="empty">Loading tasks...</div></div></section><section class="card"><h2>Admin Approval Requests</h2><div id="requests"><div class="empty">Loading requests...</div></div></section></main>
<script>
const api=async(path,opts={})=>{const res=await fetch(path,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})},credentials:"include"});let data=null;try{data=await res.json()}catch(e){}if(!res.ok)throw new Error(data&&data.error||"Something went wrong");return data};const esc=value=>{const div=document.createElement("div");div.textContent=value;return div.innerHTML};
async function load(){try{const me=await api("/api/me");if(me.role!=="admin")throw new Error("Admin access required");const tasks=await api("/api/tasks");const taskList=document.getElementById("tasks");taskList.innerHTML=tasks.length?"":"<div class=\"empty\">No active tasks.</div>";tasks.forEach(task=>{const row=document.createElement("div");row.className="row";row.innerHTML="<textarea maxlength=\"500\">"+esc(task.title)+"</textarea><button class=\"action\">Save</button><button class=\"action delete\">Delete</button>";row.querySelector(".action").onclick=async()=>{await api("/api/tasks/"+task.id,{method:"PATCH",body:JSON.stringify({title:row.querySelector("textarea").value})});load()};row.querySelector(".delete").onclick=async()=>{await api("/api/tasks/"+task.id,{method:"DELETE"});load()};taskList.appendChild(row)});const requests=await api("/api/admin-requests");const requestList=document.getElementById("requests");requestList.innerHTML=requests.length?"":"<div class=\"empty\">No pending requests.</div>";requests.forEach(request=>{const row=document.createElement("div");row.className="row";row.innerHTML="<div style=\"flex:1\"><b>"+esc(request.name)+"</b><div>"+esc(request.username)+"</div></div><button class=\"action\">Approve</button><button class=\"action reject\">Reject</button>";row.querySelector(".action").onclick=()=>processRequest(request.id,"approved");row.querySelector(".reject").onclick=()=>processRequest(request.id,"rejected");requestList.appendChild(row)})}catch(error){document.getElementById("tasks").innerHTML="<div class=\"error\">"+esc(error.message)+"</div>";document.getElementById("requests").innerHTML=""}}
async function processRequest(id,status){await api("/api/admin-requests/"+id,{method:"PATCH",body:JSON.stringify({status})});load()}document.getElementById("backBtn").onclick=()=>location.href="/";load();
</script></body></html>
