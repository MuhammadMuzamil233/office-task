<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Demands</title>
  <style>
    :root {
      --ink: #1c2b27;
      --paper: #fbf9f3;
      --ledger: #f1ece0;
      --line: #d9cfb8;
      --teal: #0f3d3e;
      --red: #a6402b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px 80px;
      background: var(--ledger);
      font: 14px Segoe UI, sans-serif;
      color: var(--ink);
    }

    main {
      max-width: 1000px;
      margin: auto;
    }

    .book {
      background: var(--teal);
      color: #fff;
      padding: 22px 28px;
      border-bottom: 4px solid #b08d3e;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .book h1 {
      margin: 0;
      font: 700 25px Georgia;
    }

    .button, .submit {
      border: 1px solid var(--teal);
      background: var(--teal);
      color: #fff;
      border-radius: 4px;
      padding: 9px 12px;
      cursor: pointer;
    }

    .button {
      background: transparent;
      border-color: #fff;
    }

    .card {
      margin-top: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
    }

    .card h2 {
      margin: 0;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      font: 600 17px Georgia;
    }

    .form {
      padding: 16px 20px;
      background: var(--ledger);
    }

    .item {
      display: grid;
      grid-template-columns: 1fr 180px 100px 1fr auto auto;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .item-urgent-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 11px;
      border: 1px solid #c0392b;
      border-radius: 4px;
      background: #fff;
      color: #c0392b;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      transition: all 0.2s;
    }

    .item-urgent-label:hover {
      background: #fdf2f0;
    }

    .item-urgent-label:has(input:checked), .item-urgent-label.urgent-active {
      background: #c0392b;
      color: #fff;
    }

    .item-urgent-label input {
      accent-color: #c0392b;
      cursor: pointer;
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .item input, .item select, .form input[type=date] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
    }

    .remove {
      border: 1px solid var(--red);
      background: transparent;
      color: var(--red);
      border-radius: 4px;
      padding: 8px;
      cursor: pointer;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-actions button {
      padding: 9px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .add {
      border: 1px solid var(--teal);
      background: transparent;
      color: var(--teal);
    }

    .group {
      border-bottom: 1px solid var(--line);
    }

    .group:last-child {
      border-bottom: 0;
    }

    .group h3 {
      margin: 0;
      padding: 13px 20px 7px;
      color: var(--teal);
      font: 600 15px Georgia;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th, .table td {
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .table th {
      background: var(--ledger);
      font-size: 11px;
      text-transform: uppercase;
      color: #68766d;
    }

    .table tr:last-child td {
      border-bottom: 0;
    }

    .status {
      font: 600 11px monospace;
      text-transform: uppercase;
    }

    .remarks {
      color: #68766d;
      font-size: 12px;
    }

    .empty, .error {
      padding: 20px;
      color: #78827d;
    }

    .error {
      color: var(--red);
    }

    .badge-urgent {
      display: inline-block;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: #c0392b;
      border-radius: 3px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .urgent-checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--red);
      font-size: 13px;
      cursor: pointer;
      padding: 6px 12px;
      background: #fdf2f0;
      border: 1px solid #f0c0b8;
      border-radius: 4px;
    }

    .urgent-checkbox-label input[type=checkbox] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--red);
    }

    @media(max-width: 600px) {
      .book {
        flex-direction: column;
      }
      .item {
        grid-template-columns: 1fr 100px;
      }
      .item .item-urgent-label, .item .remove {
        grid-column: 1/-1;
        width: max-content;
      }
    }

    /* DARK THEME STYLES */
    body.dark-theme {
      --ink: #f8fafc;
      --paper: #0e1626;
      --ledger: #060911;
      --line: rgba(255, 255, 255, 0.08);
      --teal: #06b6d4;
      --red: #f43f5e;
      background: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(99, 102, 241, 0.15), transparent),
                  radial-gradient(ellipse 60% 40% at 85% 15%, rgba(6, 182, 212, 0.12), transparent),
                  #060911 !important;
      color: #f1f5f9 !important;
    }
    body.dark-theme .book {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(17, 28, 48, 0.9) 100%) !important;
      border-bottom: 2px solid transparent !important;
      border-image: linear-gradient(90deg, #f59e0b 0%, #ec4899 40%, #06b6d4 75%, #10b981 100%) 1 !important;
    }
    body.dark-theme .card {
      background: rgba(14, 22, 38, 0.85) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: 0 12px 36px -8px rgba(0, 0, 0, 0.55) !important;
    }
    body.dark-theme .card h2 {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      color: #f8fafc !important;
    }
    body.dark-theme .form {
      background: rgba(10, 16, 28, 0.75) !important;
    }
    body.dark-theme .item input,
    body.dark-theme .item select,
    body.dark-theme .form input[type=date],
    body.dark-theme textarea {
      background: rgba(6, 10, 18, 0.9) !important;
      color: #f8fafc !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
    }
    body.dark-theme .item-urgent-label {
      background: rgba(192, 57, 43, 0.15) !important;
      border-color: #c0392b !important;
      color: #f87171 !important;
    }
    body.dark-theme .item-urgent-label:hover {
      background: rgba(192, 57, 43, 0.3) !important;
    }
    body.dark-theme .item-urgent-label:has(input:checked),
    body.dark-theme .item-urgent-label.urgent-active {
      background: #c0392b !important;
      color: #fff !important;
    }
    body.dark-theme .group {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }
    body.dark-theme .group h3 {
      color: #38bdf8 !important;
    }
    body.dark-theme .table th {
      background: rgba(10, 16, 28, 0.95) !important;
      color: #94a3b8 !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }
    body.dark-theme .table td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
      color: #f1f5f9 !important;
    }
    body.dark-theme .table tr:hover td {
      background: rgba(255, 255, 255, 0.035) !important;
    }
    body.dark-theme .remarks {
      color: #94a3b8 !important;
    }
    body.dark-theme .empty {
      color: #94a3b8 !important;
    }
    body.dark-theme .add {
      border-color: #06b6d4 !important;
      color: #06b6d4 !important;
    }
    body.dark-theme .submit {
      background: #0284c7 !important;
      border-color: #0284c7 !important;
    }
    body.dark-theme ::-webkit-scrollbar { width: 8px; height: 8px; }
    body.dark-theme ::-webkit-scrollbar-track { background: rgba(6, 10, 18, 0.8); }
    body.dark-theme ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body>
  <script>if(localStorage.getItem('user_role')==='admin'||localStorage.getItem('admin_theme')==='dark'){document.body.classList.add('dark-theme');}else{document.body.classList.remove('dark-theme');}</script>
  <main>
    <header class="book">
      <h1>Employee Demands</h1>
      <button class="button" id="back">Back to tasks</button>
    </header>
    <section class="card">
      <h2>Submit Demand</h2>
      <form class="form" id="form">
        <datalist id="inventoryModelsList"></datalist>
        <div id="items">
          <div class="item">
            <input class="product" list="inventoryModelsList" maxlength="200" placeholder="Product name / model" required>
            <select class="warehouse" required>
              <option value="">Select warehouse</option>
              <option>FC Faizabad WH</option>
              <option>FC I10 WH</option>
            </select>
            <input class="quantity" type="number" min="1" step="1" placeholder="Quantity" required>
            <input class="invoice" maxlength="100" placeholder="Invoice number (optional)">
            <label class="item-urgent-label" title="Mark this item as urgent">
              <input type="checkbox" class="item-urgent"> ⚡ Urgent
            </label>
          </div>
        </div>
        <div class="form-actions">
          <input id="date" type="date" required>
          <label class="urgent-checkbox-label">
            <input type="checkbox" id="urgentDemand"> ⚡ Mark as Urgent (Requires Admin Approval)
          </label>
          <button class="add" type="button" id="add">Add another item</button>
          <button class="submit" type="submit">Submit demand</button>
        </div>
      </form>
    </section>
    <section class="card">
      <h2>All Employee Demands</h2>
      <div id="list">
        <div class="empty">Loading demands...</div>
      </div>
    </section>
  </main>

  <script>
    const api = async (path, opts = {}) => {
      const response = await fetch(path, {
        ...opts,
        headers: {
          "Content-Type": "application/json",
          ...(opts.headers || {})
        },
        credentials: "include"
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    };

    const esc = value => {
      const element = document.createElement("div");
      element.textContent = value ?? "";
      return element.innerHTML;
    };

    const itemsOf = d => Array.isArray(d.items) ? d.items : String(d.products || "").split(",").map(value => {
      const match = value.trim().match(/^(.*?)(?:\s*\((\d+)\))?$/);
      return {
        name: match[1].trim(),
        quantity: Number(match[2] || d.quantity || 1),
        warehouse: ""
      };
    }).filter(item => item.name);

    async function load() {
      try {
        const demands = await api("/api/demands");
        const list = document.getElementById("list");
        list.innerHTML = "";
        const groups = new Map();
        demands.forEach(demand => {
          const key = demand.employee_name || "Unknown employee";
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(demand);
        });
        if (!groups.size) {
          list.innerHTML = '<div class="empty">No demands submitted yet.</div>';
          return;
        }
        groups.forEach((employeeDemands, employee) => {
          const group = document.createElement("section");
          group.className = "group";
          group.innerHTML = `<h3>${esc(employee)}'s demands</h3>`;
          employeeDemands.forEach(demand => {
            const table = document.createElement("table");
            table.className = "table";
            table.innerHTML = '<thead><tr><th>Date</th><th>Product</th><th>Warehouse</th><th>Demanded</th><th>Picked</th><th>Invoice Number</th><th>Status</th><th>Admin Remarks</th><th>Submitted At</th></tr></thead><tbody></tbody>';
            const body = table.querySelector("tbody");
            itemsOf(demand).forEach(item => {
              const row = document.createElement("tr");
              row.innerHTML = `<td>${esc(demand.date)}${demand.is_urgent ? ' <span class="badge-urgent">URGENT</span>' : ''}</td><td>${esc(item.name)}${item.isUrgent ? ' <span class="badge-urgent">⚡ URGENT</span>' : ''}</td><td>${esc(item.warehouse || "-")}</td><td>${item.quantity}</td><td>${item.pickedQuantity == null ? "-" : item.pickedQuantity}</td><td>${esc(item.invoiceNumber || "-")}</td><td class="status">${esc(item.status || demand.status)}</td><td class="remarks">${esc(demand.admin_remarks || "-")}</td><td>${new Date(demand.submitted_at).toLocaleString("en-GB")}</td>`;
              body.appendChild(row);
            });
            group.appendChild(table);
          });
          list.appendChild(group);
        });
      } catch (error) {
        document.getElementById("list").innerHTML = `<div class="error">${esc(error.message)}</div>`;
      }
    }

    document.getElementById("date").value = new Date().toISOString().slice(0, 10);
    document.getElementById("back").onclick = () => location.href = "/";

    let availableWarehouses = ["FC Faizabad WH", "FC I10 WH"];

    function getWarehouseOptionsHtml(selected = "") {
      let html = '<option value="">Select warehouse</option>';
      availableWarehouses.forEach(wh => {
        html += `<option value="${esc(wh)}"${wh === selected ? ' selected' : ''}>${esc(wh)}</option>`;
      });
      return html;
    }

    function updateWarehouseSelects() {
      document.querySelectorAll("select.warehouse").forEach(sel => {
        const val = sel.value;
        sel.innerHTML = getWarehouseOptionsHtml(val);
      });
    }

    async function loadWarehouses() {
      try {
        const list = await api("/api/warehouses");
        if (Array.isArray(list) && list.length) {
          availableWarehouses = list.map(w => w.name);
          updateWarehouseSelects();
        }
      } catch (e) {
        console.warn("Could not load warehouses", e);
      }
    }

    function wireUrgentToggle(row) {
      const chk = row.querySelector(".item-urgent");
      const lbl = row.querySelector(".item-urgent-label");
      if (chk && lbl) {
        chk.onchange = () => {
          if (chk.checked) lbl.classList.add("urgent-active");
          else lbl.classList.remove("urgent-active");
        };
      }
    }

    // Wire up first item
    document.querySelectorAll(".item").forEach(wireUrgentToggle);

    function createItemRow(initial = {}) {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `
        <input class="product" list="inventoryModelsList" maxlength="200" placeholder="Product name / model" required>
        <select class="warehouse" required>
          ${getWarehouseOptionsHtml(initial.warehouse || "")}
        </select>
        <input class="quantity" type="number" min="1" step="1" placeholder="Quantity" value="${initial.quantity || ''}" required>
        <input class="invoice" maxlength="100" placeholder="Invoice number (optional)" value="${initial.invoiceNumber || ''}">
        <label class="item-urgent-label ${initial.isUrgent ? 'urgent-active' : ''}" title="Mark this item as urgent">
          <input type="checkbox" class="item-urgent" ${initial.isUrgent ? 'checked' : ''}> ⚡ Urgent
        </label>
        <button type="button" class="remove">Remove</button>
      `;
      const prodInput = row.querySelector(".product");
      if (initial.name) {
        prodInput.value = initial.name;
        if (initial.fromInventory) {
          prodInput.setAttribute("data-from-inventory", "1");
          prodInput.setAttribute("data-inventory-id", initial.inventoryItemId || "");
          prodInput.setAttribute("data-inventory-model", initial.inventoryModel || initial.name);
          prodInput.style.borderColor = "#0284c7";
          prodInput.style.background = "#f0f9ff";
        }
      }
      row.querySelector(".remove").onclick = () => {
        if (document.querySelectorAll(".item").length > 1) {
          row.remove();
        } else {
          prodInput.value = "";
          const qInput = row.querySelector(".quantity");
          if (qInput) qInput.value = "";
          const invInput = row.querySelector(".invoice");
          if (invInput) invInput.value = "";
        }
      };
      wireUrgentToggle(row);
      return row;
    }

    document.getElementById("add").onclick = () => {
      const row = createItemRow();
      document.getElementById("items").appendChild(row);
    };

    document.getElementById("form").onsubmit = async event => {
      event.preventDefault();
      try {
        const rawProducts = [...document.querySelectorAll(".item")].map(row => {
          const prodInput = row.querySelector(".product");
          const fromInv = prodInput ? prodInput.getAttribute("data-from-inventory") === "1" : false;
          const invId = prodInput ? (prodInput.getAttribute("data-inventory-id") || "") : "";
          const invModel = prodInput ? (prodInput.getAttribute("data-inventory-model") || "") : "";
          const isItemUrgent = Boolean(row.querySelector(".item-urgent")?.checked);
          return {
            name: prodInput.value.trim(),
            warehouse: row.querySelector(".warehouse").value,
            quantity: Number(row.querySelector(".quantity").value),
            invoiceNumber: row.querySelector(".invoice")?.value?.trim() || "",
            fromInventory: fromInv,
            inventoryItemId: invId,
            inventoryModel: invModel,
            isUrgent: isItemUrgent
          };
        });

        // Ensure each model only appears ONCE in demand (merge quantities)
        const products = [];
        rawProducts.forEach(item => {
          const mKey = String(item.inventoryModel || item.name || "").trim().toLowerCase();
          const whKey = String(item.warehouse || "").trim().toLowerCase();
          const existing = products.find(x => {
            const xKey = String(x.inventoryModel || x.name || "").trim().toLowerCase();
            const xWh = String(x.warehouse || "").trim().toLowerCase();
            return xKey && xKey === mKey && xWh === whKey;
          });
          if (existing) {
            existing.quantity += item.quantity;
            if (!existing.invoiceNumber && item.invoiceNumber) existing.invoiceNumber = item.invoiceNumber;
            if (item.isUrgent) existing.isUrgent = true;
          } else {
            products.push(item);
          }
        });

        const isOverallUrgent = Boolean(document.getElementById("urgentDemand")?.checked);
        if (isOverallUrgent) {
          products.forEach(p => p.isUrgent = true);
        }
        const hasAnyUrgent = products.some(p => p.isUrgent) || isOverallUrgent;
        await api("/api/demands", {
          method: "POST",
          body: JSON.stringify({
            date: document.getElementById("date").value,
            products,
            isUrgent: hasAnyUrgent
          })
        });
        event.target.reset();
        document.getElementById("date").value = new Date().toISOString().slice(0, 10);
        if (document.getElementById("urgentDemand")) document.getElementById("urgentDemand").checked = false;
        document.getElementById("items").innerHTML = `
          <div class="item">
            <input class="product" list="inventoryModelsList" maxlength="200" placeholder="Product name / model" required>
            <select class="warehouse" required>
              ${getWarehouseOptionsHtml()}
            </select>
            <input class="quantity" type="number" min="1" step="1" placeholder="Quantity" required>
            <input class="invoice" maxlength="100" placeholder="Invoice number (optional)">
            <label class="item-urgent-label" title="Mark this item as urgent">
              <input type="checkbox" class="item-urgent"> ⚡ Urgent
            </label>
          </div>
        `;
        document.querySelectorAll(".item").forEach(wireUrgentToggle);
        load();
      } catch (error) {
        alert(error.message);
      }
    };

    api("/api/me").then(me => {
      if (me.role === 'admin') {
        document.body.classList.add('dark-theme');
        localStorage.setItem('user_role', 'admin');
        localStorage.setItem('admin_theme', 'dark');
      } else {
        document.body.classList.remove('dark-theme');
        localStorage.removeItem('admin_theme');
        localStorage.setItem('user_role', me.role || '');
      }
      if (me.role === "logistics") location.href = "/logistics.html";
    }).catch(() => location.href = "/");

    // Pre-fill model(s) if navigated from inventory
    function checkInventoryParams() {
      // 1. Check multi-item bulk demand from inventory
      const bulkDataRaw = sessionStorage.getItem("inventory_bulk_demands");
      if (bulkDataRaw) {
        try {
          const bulkData = JSON.parse(bulkDataRaw);
          sessionStorage.removeItem("inventory_bulk_demands");
          if (bulkData && Array.isArray(bulkData.items) && bulkData.items.length) {
            if (bulkData.date) document.getElementById("date").value = bulkData.date;
            if (bulkData.isUrgent && document.getElementById("urgentDemand")) {
              document.getElementById("urgentDemand").checked = true;
            }
            const itemsContainer = document.getElementById("items");
            itemsContainer.innerHTML = "";
            bulkData.items.forEach(item => {
              const row = createItemRow(item);
              itemsContainer.appendChild(row);
            });

            // Add banner
            const existingBanner = document.getElementById("inventoryBulkBanner");
            if (existingBanner) existingBanner.remove();
            const banner = document.createElement("div");
            banner.id = "inventoryBulkBanner";
            banner.style.cssText = "background:#dcfce7;border:1px solid #86efac;color:#15803d;padding:10px 14px;border-radius:8px;font-weight:600;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px;";
            banner.innerHTML = `<span>📦</span> Loaded <b>${bulkData.items.length} item(s)</b> from Office Inventory. All items will be submitted together in one demand!`;
            itemsContainer.parentNode.insertBefore(banner, itemsContainer);
            return;
          }
        } catch (e) {
          console.warn("Failed to parse bulk inventory demand:", e);
        }
      }

      // 2. Single item parameter fallback
      const params = new URLSearchParams(window.location.search);
      if (params.get("fromInventory") === "1") {
        const model = params.get("model") || "";
        const invId = params.get("inventoryId") || "";
        const firstProd = document.querySelector(".item .product");
        if (firstProd && model) {
          firstProd.value = model;
          firstProd.setAttribute("data-from-inventory", "1");
          firstProd.setAttribute("data-inventory-id", invId);
          firstProd.setAttribute("data-inventory-model", model);
          firstProd.style.borderColor = "#0284c7";
          firstProd.style.background = "#f0f9ff";

          const hint = document.createElement("small");
          hint.id = "inventoryOriginHint";
          hint.style.cssText = "color:#0284c7;font-size:11px;font-weight:600;display:block;margin-top:2px;";
          hint.textContent = "📦 Linked from Office Inventory: " + model;
          firstProd.parentNode.insertBefore(hint, firstProd.nextSibling);
        }
      }
    }

    // Populate inventory models datalist
    api("/api/inventory").then(data => {
      const dl = document.getElementById("inventoryModelsList");
      if (dl && data && Array.isArray(data.rows)) {
        dl.innerHTML = "";
        const unique = [...new Set(data.rows.map(r => r.model).filter(Boolean))].sort();
        unique.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m;
          dl.appendChild(opt);
        });
      }
    }).catch(() => {});

    loadWarehouses().then(() => {
      checkInventoryParams();
    }).catch(() => {
