<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Demands</title>
  <style>
    :root {
      --ink: #1c2b27;
      --paper: #fbf9f3;
      --ledger: #f1ece0;
      --line: #d9cfb8;
      --teal: #0f3d3e;
      --red: #a6402b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px 80px;
      background: var(--ledger);
      font: 14px Segoe UI, sans-serif;
      color: var(--ink);
    }

    main {
      max-width: 1000px;
      margin: auto;
    }

    .book {
      background: var(--teal);
      color: #fff;
      padding: 22px 28px;
      border-bottom: 4px solid #b08d3e;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .book h1 {
      margin: 0;
      font: 700 25px Georgia;
    }

    .button, .submit {
      border: 1px solid var(--teal);
      background: var(--teal);
      color: #fff;
      border-radius: 4px;
      padding: 9px 12px;
      cursor: pointer;
    }

    .button {
      background: transparent;
      border-color: #fff;
    }

    .card {
      margin-top: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
    }

    .card h2 {
      margin: 0;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      font: 600 17px Georgia;
    }

    .form {
      padding: 16px 20px;
      background: var(--ledger);
    }

    .item {
      display: grid;
      grid-template-columns: 1fr 180px 100px 1fr auto;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .item input, .item select, .form input[type=date] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
    }

    .remove {
      border: 1px solid var(--red);
      background: transparent;
      color: var(--red);
      border-radius: 4px;
      padding: 8px;
      cursor: pointer;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-actions button {
      padding: 9px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .add {
      border: 1px solid var(--teal);
      background: transparent;
      color: var(--teal);
    }

    .group {
      border-bottom: 1px solid var(--line);
    }

    .group:last-child {
      border-bottom: 0;
    }

    .group h3 {
      margin: 0;
      padding: 13px 20px 7px;
      color: var(--teal);
      font: 600 15px Georgia;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th, .table td {
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .table th {
      background: var(--ledger);
      font-size: 11px;
      text-transform: uppercase;
      color: #68766d;
    }

    .table tr:last-child td {
      border-bottom: 0;
    }

    .status {
      font: 600 11px monospace;
      text-transform: uppercase;
    }

    .remarks {
      color: #68766d;
      font-size: 12px;
    }

    .empty, .error {
      padding: 20px;
      color: #78827d;
    }

    .error {
      color: var(--red);
    }

    .badge-urgent {
      display: inline-block;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: #c0392b;
      border-radius: 3px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .urgent-checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--red);
      font-size: 13px;
      cursor: pointer;
      padding: 6px 12px;
      background: #fdf2f0;
      border: 1px solid #f0c0b8;
      border-radius: 4px;
    }

    .urgent-checkbox-label input[type=checkbox] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--red);
    }

    @media(max-width: 600px) {
      .book {
        flex-direction: column;
      }
      .item {
        grid-template-columns: 1fr 100px;
      }
      .item .remove {
        grid-column: 1/-1;
        width: max-content;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="book">
      <h1>Employee Demands</h1>
      <button class="button" id="back">Back to tasks</button>
    </header>
    <section class="card">
      <h2>Submit Demand</h2>
      <form class="form" id="form">
        <div id="items">
          <div class="item">
            <input class="product" maxlength="200" placeholder="Product name" required>
            <select class="warehouse" required>
              <option value="">Select warehouse</option>
              <option>FC Faizabad WH</option>
              <option>FC I10 WH</option>
            </select>
            <input class="quantity" type="number" min="1" step="1" placeholder="Quantity" required>
            <input class="invoice" maxlength="100" placeholder="Invoice number (optional)">
          </div>
        </div>
        <div class="form-actions">
          <input id="date" type="date" required>
          <label class="urgent-checkbox-label">
            <input type="checkbox" id="urgentDemand"> ⚡ Mark as Urgent (Requires Admin Approval)
          </label>
          <button class="add" type="button" id="add">Add another item</button>
          <button class="submit" type="submit">Submit demand</button>
        </div>
      </form>
    </section>
    <section class="card">
      <h2>All Employee Demands</h2>
      <div id="list">
        <div class="empty">Loading demands...</div>
      </div>
    </section>
  </main>

  <script>
    const api = async (path, opts = {}) => {
      const response = await fetch(path, {
        ...opts,
        headers: {
          "Content-Type": "application/json",
          ...(opts.headers || {})
        },
        credentials: "include"
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    };

    const esc = value => {
      const element = document.createElement("div");
      element.textContent = value ?? "";
      return element.innerHTML;
    };

    const itemsOf = d => Array.isArray(d.items) ? d.items : String(d.products || "").split(",").map(value => {
      const match = value.trim().match(/^(.*?)(?:\s*\((\d+)\))?$/);
      return {
        name: match[1].trim(),
        quantity: Number(match[2] || d.quantity || 1),
        warehouse: ""
      };
    }).filter(item => item.name);

    async function load() {
      try {
        const demands = await api("/api/demands");
        const list = document.getElementById("list");
        list.innerHTML = "";
        const groups = new Map();
        demands.forEach(demand => {
          const key = demand.employee_name || "Unknown employee";
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(demand);
        });
        if (!groups.size) {
          list.innerHTML = '<div class="empty">No demands submitted yet.</div>';
          return;
        }
        groups.forEach((employeeDemands, employee) => {
          const group = document.createElement("section");
          group.className = "group";
          group.innerHTML = `<h3>${esc(employee)}'s demands</h3>`;
          employeeDemands.forEach(demand => {
            const table = document.createElement("table");
            table.className = "table";
            table.innerHTML = '<thead><tr><th>Date</th><th>Product</th><th>Warehouse</th><th>Demanded</th><th>Picked</th><th>Invoice Number</th><th>Status</th><th>Admin Remarks</th><th>Submitted At</th></tr></thead><tbody></tbody>';
            const body = table.querySelector("tbody");
            itemsOf(demand).forEach(item => {
              const row = document.createElement("tr");
              row.innerHTML = `<td>${esc(demand.date)}${demand.is_urgent ? ' <span class="badge-urgent">URGENT</span>' : ''}</td><td>${esc(item.name)}</td><td>${esc(item.warehouse || "-")}</td><td>${item.quantity}</td><td>${item.pickedQuantity == null ? "-" : item.pickedQuantity}</td><td>${esc(item.invoiceNumber || "-")}</td><td class="status">${esc(item.status || demand.status)}</td><td class="remarks">${esc(demand.admin_remarks || "-")}</td><td>${new Date(demand.submitted_at).toLocaleString("en-GB")}</td>`;
              body.appendChild(row);
            });
            group.appendChild(table);
          });
          list.appendChild(group);
        });
      } catch (error) {
        document.getElementById("list").innerHTML = `<div class="error">${esc(error.message)}</div>`;
      }
    }

    document.getElementById("date").value = new Date().toISOString().slice(0, 10);
    document.getElementById("back").onclick = () => location.href = "/";
    document.getElementById("add").onclick = () => {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `
        <input class="product" maxlength="200" placeholder="Product name" required>
        <select class="warehouse" required>
          <option value="">Select warehouse</option>
          <option>FC Faizabad WH</option>
          <option>FC I10 WH</option>
        </select>
        <input class="quantity" type="number" min="1" step="1" placeholder="Quantity" required>
        <input class="invoice" maxlength="100" placeholder="Invoice number (optional)">
        <button type="button" class="remove">Remove</button>
      `;
      row.querySelector(".remove").onclick = () => row.remove();
      document.getElementById("items").appendChild(row);
    };

    document.getElementById("form").onsubmit = async event => {
      event.preventDefault();
      try {
        const products = [...document.querySelectorAll(".item")].map(row => {
          const prodInput = row.querySelector(".product");
          const fromInv = prodInput ? prodInput.getAttribute("data-from-inventory") === "1" : false;
          const invId = prodInput ? (prodInput.getAttribute("data-inventory-id") || "") : "";
          const invModel = prodInput ? (prodInput.getAttribute("data-inventory-model") || "") : "";
          return {
            name: prodInput.value,
            warehouse: row.querySelector(".warehouse").value,
            quantity: Number(row.querySelector(".quantity").value),
            invoiceNumber: row.querySelector(".invoice")?.value || "",
            fromInventory: fromInv,
            inventoryItemId: invId,
            inventoryModel: invModel
          };
        });
        const isUrgent = Boolean(document.getElementById("urgentDemand")?.checked);
        await api("/api/demands", {
          method: "POST",
          body: JSON.stringify({
            date: document.getElementById("date").value,
            products,
            isUrgent
          })
        });
        event.target.reset();
        document.getElementById("date").value = new Date().toISOString().slice(0, 10);
        if (document.getElementById("urgentDemand")) document.getElementById("urgentDemand").checked = false;
        document.getElementById("items").innerHTML = `
          <div class="item">
            <input class="product" maxlength="200" placeholder="Product name" required>
            <select class="warehouse" required>
              <option value="">Select warehouse</option>
              <option>FC Faizabad WH</option>
              <option>FC I10 WH</option>
            </select>
            <input class="quantity" type="number" min="1" step="1" placeholder="Quantity" required>
            <input class="invoice" maxlength="100" placeholder="Invoice number (optional)">
          </div>
        `;
        load();
      } catch (error) {
        alert(error.message);
      }
    };

    api("/api/me").then(me => {
      if (me.role === "logistics") location.href = "/logistics.html";
    }).catch(() => location.href = "/");

    // Pre-fill model if navigated from inventory
    (function checkInventoryParams() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("fromInventory") === "1") {
        const model = params.get("model") || "";
        const invId = params.get("inventoryId") || "";
        const firstProd = document.querySelector(".item .product");
        if (firstProd && model) {
          firstProd.value = model;
          firstProd.setAttribute("data-from-inventory", "1");
          firstProd.setAttribute("data-inventory-id", invId);
          firstProd.setAttribute("data-inventory-model", model);
          firstProd.style.borderColor = "#0284c7";
          firstProd.style.background = "#f0f9ff";

          const hint = document.createElement("small");
          hint.id = "inventoryOriginHint";
          hint.style.cssText = "color:#0284c7;font-size:11px;font-weight:600;display:block;margin-top:2px;";
          hint.textContent = "📦 Linked from Office Inventory: " + model;
          firstProd.parentNode.insertBefore(hint, firstProd.nextSibling);
        }
      }
    })();

    load();
  </script>
</body>
</html>
